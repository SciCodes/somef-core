[tool.poetry]
name = "somef_core"
version = "0.0.1"
description = "SOMEF-Core: lightweight metadata extraction engine for software repositories, usable as a CLI tool or as a library, without the ML-based classifiers and ontology detection of the full SOMEF tool."
authors = ["Daniel Garijo <daniel.garijo@upm.es>"]
readme = "README.md"
packages = [
    { include = "somef_core", from = "src" }
]
classifiers = [ 
    "Programming Language :: Python :: 3.11", 
    "Operating System :: OS Independent", 
    "License :: OSI Approved :: MIT License", 
    "Topic :: Software Development :: Libraries :: Python Modules"
    ]
    
[tool.poetry.urls]
homepage = "https://github.com/SciCodes/somef-core"

[tool.poetry.dependencies]
    python = ">=3.11,<3.13"
    bs4 = ">=0.0.1,<0.0.3"
    click = "^8.1.7"
    click-option-group = "^0.5.6"
    matplotlib = "^3.11.0"
    nltk = "^3.9.0"
    numpy = ">=1.26.3,<3.0.0"
    pandas = "^2.1.4"
    textblob = ">=0.17.1,<0.21.0"
    validators = "^0.35.0"
    scipy = "^1.11.4"
    inflect = "^7.0.0"
    contractions = "^0.1.73"
    chardet = ">=5.2,<8.0"
    pytest = ">=8,<10"
    bibtexparser = "^1.4.1"
    nbformat = "^5.9.2"
    markdown = "^3.5.2"
    requests = "^2.34.2"
    pyyaml = "^6.0.2"
    lxml = "^6.1.1"
    markdown-it-py = ">=3,<5"
    
[tool.poetry.scripts]
somef_core = "somef_core.__main__:cli"

[build-system]
requires = ["poetry-core>=1.1.10"]
build-backend = "poetry.core.masonry.api"
